[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emperor"
version = "0.1.0"
description = "Terminal coding assistant powered by local Ollama models"
requires-python = ">=3.10"
dependencies = [
    "ollama",
]

[project.scripts]
emperor = "emperor.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["emperor*"]